name: Deploy to Stage

on:
  push:
    branches:
      - stage

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Create Environment Variables
        run: |
          # Create exactly the .env variable required for staging 
          # Assuming /api/v1 is needed based on your local .env configuration
          # You can also replace this with GitHub secrets later if needed
          echo "VITE_API_BASE_URL=https://api.skylinedynamic.dev/api/v1" > .env.local

      - name: Build Application
        run: npm run build

      - name: Deploy to EC2 & Restart Nginx
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: "dist/"
          TARGET: "/var/www/client-portal-react"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no" 
          SCRIPT_AFTER: |
            echo "Setting correct directory permissions..."
            sudo chown -R www-data:www-data /var/www/client-portal-react || echo "Warning: chown failed, ignoring..."
            
            echo "Restarting Nginx..."
            sudo systemctl restart nginx
            echo "Nginx restarted successfully."

      - name: Post-Deployment Smoke Test
        run: |
          echo "Ensuring the service is up..."
          sleep 5
          # Replace the URL below with the actual staging URL domain to check if the deployed site returns a 200 OK
          STAGE_URL="${{ secrets.STAGE_WEB_URL || 'https://your-stage-domain.com' }}"
          
          if [ "$STAGE_URL" == "https://your-stage-domain.com" ]; then
            echo "Disclaimer: Smoke test domain is not defined. Please add STAGE_WEB_URL to GitHub Secrets."
          else
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGE_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
               echo "✅ Smoke test passed! Staging server responded with HTTP $HTTP_STATUS."
            else
               echo "❌ Smoke test failed! Expected HTTP 200 but received $HTTP_STATUS."
               exit 1
            fi
          fi
