  <script>
    (function () {
      // Paints the tenant's brand before React mounts.
      //
      // The variable map is precomputed and persisted by applyBrandTheme() in
      // src/utils/brandingTheme.ts, so there is deliberately no colour maths and
      // no knowledge of the branding schema here - an earlier version duplicated
      // both, across two differently shaped storage keys, and drifted out of sync.
      try {
        // A COLD visit - nothing in localStorage yet - is the case that used to
        // flash the packaged default brand until the theme request landed. Ask
        // the API for this tenant's brand as a stylesheet, first thing: a <link>
        // appended while the head is still parsing blocks the first paint, so the
        // right colours are there before anything renders.
        //
        // Inserted from script rather than written statically because the API has
        // to be told which portal is asking, and only the browser knows the
        // hostname. Vite substitutes the API base at build time.
        //
        // Ordering with the cached map below is deliberate: that path sets inline
        // styles on :root, which outrank this stylesheet, so a repeat visitor
        // still paints instantly from localStorage and this only decides the
        // cold case.
        // VITE_API_BASE_URL carries the /api/v1 suffix here, and branding.css sits
        // outside the version prefix, so trim it back to the API root.
        var apiBase = '%VITE_API_BASE_URL%';
        if (apiBase && apiBase.charAt(0) !== '%') {
          var brandLink = document.createElement('link');
          brandLink.rel = 'stylesheet';
          brandLink.href = apiBase.replace(/\/api\/v1\/?$/, '') + '/api/branding.css?d=' + encodeURIComponent(location.hostname);
          document.head.appendChild(brandLink);
        }

        var cached = localStorage.getItem('brand-css-vars');
        if (cached) {
          var brand = JSON.parse(cached);
          if (brand && brand.v === 1 && brand.vars) {
            var style = document.documentElement.style;
            for (var name in brand.vars) {
              if (Object.prototype.hasOwnProperty.call(brand.vars, name)) {
                style.setProperty(name, brand.vars[name]);
              }
            }
          }
        }

        // Title and favicon still come from the persisted branding store, falling
        // back to the public (pre-login) copy.
        var stored = localStorage.getItem('branding');
        var branding = null;
        if (stored) {
          var parsed = JSON.parse(stored);
          branding = parsed && parsed.state && parsed.state.branding;
        }
        if (!branding) {
          var publicStr = localStorage.getItem('public_branding');
          if (publicStr) { branding = JSON.parse(publicStr); }
        }

        if (branding) {
          var fav = branding.favicon_full_url || branding.favicon || branding.website_favicon;
          if (fav && fav !== 'null') {
            var existingFav = document.querySelector("link[rel~='icon']");
            if (existingFav) { existingFav.href = fav; }
            else {
              var newFav = document.createElement('link');
              newFav.rel = 'icon';
              newFav.href = fav;
              document.head.appendChild(newFav);
            }
          }
          if (branding.meta_title || branding.site_name) {
            document.title = branding.meta_title || branding.site_name;
          }
        }
      } catch (e) {
        console.error('Branding initialization error:', e);
      }
    })();
  </script>
