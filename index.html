<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      try {
        var storeStr = localStorage.getItem('branding');
        if (storeStr) {
          var parsed = JSON.parse(storeStr);
          if (parsed && parsed.state && parsed.state.branding) {
            var branding = parsed.state.branding;
            var primary = branding.primary_color;
            var secondary = branding.secondary_color;
            if (primary && primary !== 'null') {
              document.documentElement.style.setProperty('--primary-color', primary);
            }
            if (secondary && secondary !== 'null') {
              document.documentElement.style.setProperty('--secondary-color', secondary);
            }
            var fav = branding.favicon_full_url || branding.favicon || branding.website_favicon;
            if (fav && fav !== 'null') {
              var existingFav = document.querySelector("link[rel~='icon']");
              if (existingFav) { existingFav.href = fav; }
              else {
                var newFav = document.createElement('link');
                newFav.rel = 'icon';
                newFav.href = fav;
                document.head.appendChild(newFav);
              }
            }
            if (branding.meta_title || branding.site_name) {
              document.title = branding.meta_title || branding.site_name;
            }
            return;
          }
        }
        var publicStr = localStorage.getItem('public_branding');
        if (publicStr) {
          var publicConfig = JSON.parse(publicStr);
          if (publicConfig) {
            var primary = publicConfig.primary_color;
            var secondary = publicConfig.secondary_color;
            if (primary && primary !== 'null') {
              document.documentElement.style.setProperty('--primary-color', primary);
            }
            if (secondary && secondary !== 'null') {
              document.documentElement.style.setProperty('--secondary-color', secondary);
            }
            var pFav = publicConfig.favicon_full_url || publicConfig.favicon || publicConfig.website_favicon;
            if (pFav && pFav !== 'null') {
              var pExistingFav = document.querySelector("link[rel~='icon']");
              if (pExistingFav) { pExistingFav.href = pFav; }
              else {
                var pNewFav = document.createElement('link');
                pNewFav.rel = 'icon';
                pNewFav.href = pFav;
                document.head.appendChild(pNewFav);
              }
            }
            if (publicConfig.meta_title || publicConfig.site_name) {
              document.title = publicConfig.meta_title || publicConfig.site_name;
            }
          }
        }
      } catch (e) {
        console.error('Branding initialization error:', e);
      }
    })();
  </script>
