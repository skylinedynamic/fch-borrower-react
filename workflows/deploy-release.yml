name: Deploy to Production

on:
  push:
    branches:
      - release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Create Environment Variables
        run: |
          # Production API URL
          echo "VITE_API_BASE_URL=https://api.fourcornerfunding.com/api/v1" > .env.production

      - name: Build Application
        run: npm run build

      - name: Deploy to EC2 & Restart Nginx
        uses: easingthemes/ssh-deploy@main
        env:
          # Note: Using PROD_ prefixed secrets so they don't conflict with staging
          SSH_PRIVATE_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.PROD_EC2_HOST }}
          REMOTE_USER: ${{ secrets.PROD_EC2_USER }}
          SOURCE: "dist/"
          TARGET: "/var/www/client-portal-react"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no" 
          SCRIPT_BEFORE: |
            echo "Creating target directory if it doesn't exist..."
            sudo mkdir -p /var/www/client-portal-react
            echo "Temporarily giving SSH user permission to write to directory..."
            sudo chown -R $(whoami):$(whoami) /var/www/client-portal-react
          SCRIPT_AFTER: |
            echo "Setting correct directory permissions for Nginx..."
            sudo chown -R www-data:www-data /var/www/client-portal-react || echo "Warning: chown failed, ignoring..."
            
            echo "Restarting Nginx..."
            sudo systemctl restart nginx
            echo "Nginx restarted successfully."

      - name: Post-Deployment Smoke Test
        run: |
          echo "Ensuring the service is up..."
          sleep 5
          # Smoke test url for production
          PROD_URL="${{ secrets.PROD_WEB_URL || 'https://your-prod-domain.com' }}"
          
          if [ "$PROD_URL" == "https://your-prod-domain.com" ]; then
            echo "Disclaimer: Smoke test domain is not defined. Please add PROD_WEB_URL to GitHub Secrets."
          else
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL")
            if [ "$HTTP_STATUS" -eq 200 ]; then
               echo "✅ Smoke test passed! Production server responded with HTTP $HTTP_STATUS."
            else
               echo "❌ Smoke test failed! Expected HTTP 200 but received $HTTP_STATUS."
               exit 1
            fi
          fi
